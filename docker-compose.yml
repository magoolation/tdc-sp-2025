version: '3.8'

services:
  account-db:
    image: postgres:17-alpine
    container_name: banking-account-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: AccountDB
    ports:
      - "5432:5432"
    volumes:
      - account_data:/var/lib/postgresql/data
    networks:
      - banking-network

  transaction-db:
    image: postgres:17-alpine
    container_name: banking-transaction-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: TransactionDB
    ports:
      - "5433:5432"
    volumes:
      - transaction_data:/var/lib/postgresql/data
    networks:
      - banking-network

  cache:
    image: redis:7-alpine
    container_name: banking-cache
    ports:
      - "6379:6379"
    networks:
      - banking-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: banking-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - banking-network

volumes:
  account_data:
  transaction_data:
  rabbitmq_data:

networks:
  banking-network:
    driver: bridge